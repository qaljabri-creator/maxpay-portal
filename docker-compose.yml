# Local PostgreSQL for development. Production runs a managed instance with
# the daily automated backups required by spec §11.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxpay}
      POSTGRES_USER: ${POSTGRES_USER:-maxpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxpay}
    ports:
      - "5432:5432"
    volumes:
      - maxpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxpay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The shared cache behind both rate limiters (spec §11). Without one, each
  # worker process counts its own private allowance, which is to say neither
  # limiter is a limit; `manage.py check --deploy` says so as core.W010.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maxpay_pgdata:
